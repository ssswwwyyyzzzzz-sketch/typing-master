
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Master</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  padding: 15px;
}

.container {
  max-width: 900px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #38bdf8;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 15px;
}

.sentence {
  font-size: 20px;
  line-height: 1.8;
  background: #0f172a;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.correct {
  color: #22c55e;
}

.wrong {
  color: #ef4444;
  background: #451a1a;
}

.current {
  background: #38bdf8;
  color: #000;
  border-radius: 3px;
}

input {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  outline: none;
  margin-bottom: 15px;
}

button {
  padding: 12px 18px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: #38bdf8;
  color: #000;
  margin: 5px;
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.stat {
  flex: 1;
  min-width: 100px;
  text-align: center;
  background: #0f172a;
  padding: 15px;
  border-radius: 10px;
}

.stat h2 {
  color: #38bdf8;
  margin: 5px;
}

.keyboard {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 20px;
  overflow-x: auto;
}

.key-row {
  display: flex;
  justify-content: center;
  gap: 4px;
  min-width: 500px;
}

.key {
  background: #334155;
  border: 1px solid #64748b;
  border-radius: 5px;
  padding: 10px 5px;
  min-width: 30px;
  text-align: center;
  font-size: 13px;
  flex: 1;
}

.key.active {
  background: #facc15;
  color: #000;
  border-color: white;
  transform: scale(1.08);
}

.key.pressed {
  background: #22c55e;
  color: #000;
}

.key.wrong-key {
  background: #ef4444;
  color: white;
}

.space {
  flex: 5;
}

#result {
  display: none;
  text-align: center;
}

#typingArea {
  display: none;
}

</style>
</head>

<body>

<div class="container">

<h1>⌨️ Typing Master</h1>

<div class="card" id="home">

<h2>Typing Practice</h2>

<p>Level चुनें:</p>

<button onclick="startTest('beginner')">Beginner</button>
<button onclick="startTest('medium')">Medium</button>
<button onclick="startTest('advanced')">Advanced</button>

</div>

<div class="card" id="typingArea">

<div class="stats">

<div class="stat">
<p>Time</p>
<h2 id="time">60</h2>
</div>

<div class="stat">
<p>Speed</p>
<h2 id="wpm">0</h2>
</div>

<div class="stat">
<p>Accuracy</p>
<h2 id="accuracy">100%</h2>
</div>

</div>

<h3>इस वाक्य को टाइप करें:</h3>

<div class="sentence" id="sentence"></div>

<input
id="typingInput"
placeholder="यहाँ टाइप करें..."
autocomplete="off"
autocorrect="off"
autocapitalize="off"
spellcheck="false"
>

<h3>⌨️ Keyboard</h3>

<p>अगली Key पीले रंग में दिखाई देगी।</p>

<div class="keyboard" id="keyboard"></div>

<button onclick="restartTest()">Restart</button>

</div>

<div class="card" id="result">

<h2>🎉 Test Complete!</h2>

<h3>Typing Speed: <span id="finalWpm"></span> WPM</h3>

<h3>Accuracy: <span id="finalAccuracy"></span></h3>

<h3>Correct Characters: <span id="correctChars"></span></h3>

<h3>Wrong Characters: <span id="wrongChars"></span></h3>

<button onclick="goHome()">Home</button>
<button onclick="restartTest()">Try Again</button>

</div>

</div>

<script>

const sentences = {

beginner: [
"The quick brown fox jumps over the lazy dog.",
"I am learning typing every day.",
"Practice makes a person better.",
"Typing is an important computer skill.",
"I can improve my typing speed."
],

medium: [
"Learning new skills requires patience and practice.",
"Typing accurately is more important than typing fast.",
"Every day I am improving my computer skills.",
"Good typing habits help us work efficiently."
],

advanced: [
"Technology has transformed the way people communicate and work.",
"Accuracy and consistency are essential for professional typing.",
"Developing computer skills creates new opportunities."
]

};

let currentSentence = "";
let timer;
let timeLeft = 60;
let started = false;

const keyboardRows = [
["1","2","3","4","5","6","7","8","9","0"],
["q","w","e","r","t","y","u","i","o","p"],
["a","s","d","f","g","h","j","k","l"],
["z","x","c","v","b","n","m"],
["SPACE","BACKSPACE","ENTER"]
];

function createKeyboard() {

const keyboard = document.getElementById("keyboard");

keyboard.innerHTML = "";

keyboardRows.forEach(row => {

const rowDiv = document.createElement("div");
rowDiv.className = "key-row";

row.forEach(key => {

const keyDiv = document.createElement("div");

keyDiv.className = "key";
keyDiv.textContent = key;

if(key === "SPACE") {
keyDiv.classList.add("space");
}

keyDiv.id = "key-" + key;

rowDiv.appendChild(keyDiv);

});

keyboard.appendChild(rowDiv);

});

}

function startTest(level) {

currentSentence =
sentences[level][Math.floor(Math.random() * sentences[level].length)];

document.getElementById("home").style.display = "none";
document.getElementById("result").style.display = "none";
document.getElementById("typingArea").style.display = "block";

timeLeft = 60;
started = false;

document.getElementById("time").textContent = timeLeft;
document.getElementById("typingInput").value = "";
document.getElementById("typingInput").disabled = false;

createKeyboard();
showSentence();

document.getElementById("typingInput").focus();

}

function showSentence() {

const input = document.getElementById("typingInput").value;

let html = "";

for(let i = 0; i < currentSentence.length; i++) {

if(i < input.length) {

if(input[i] === currentSentence[i]) {
html += `<span class="correct">${currentSentence[i]}</span>`;
} else {
html += `<span class="wrong">${currentSentence[i]}</span>`;
}

} else if(i === input.length) {

html += `<span class="current">${currentSentence[i]}</span>`;

} else {

html += currentSentence[i];

}

}

document.getElementById("sentence").innerHTML = html;

highlightKey();

}

function highlightKey() {

document.querySelectorAll(".key").forEach(key => {
key.classList.remove("active");
});

const input = document.getElementById("typingInput").value;

const nextChar = currentSentence[input.length];

if(!nextChar) return;

let keyName = nextChar.toLowerCase();

if(nextChar === " ") {
keyName = "SPACE";
}

const key = document.getElementById("key-" + keyName);

if(key) {
key.classList.add("active");
}

}

document.getElementById("typingInput").addEventListener("input", function() {

if(!started) {
started = true;
startTimer();
}

showSentence();
calculateStats();

if(this.value.length >= currentSentence.length) {
finishTest();
}

});

function startTimer() {

timer = setInterval(() => {

timeLeft--;

document.getElementById("time").textContent = timeLeft;

calculateStats();

if(timeLeft <= 0) {
finishTest();
}

}, 1000);

}

function calculateStats() {

const input = document.getElementById("typingInput").value;

let correct = 0;

for(let i = 0; i < input.length; i++) {

if(input[i] === currentSentence[i]) {
correct++;
}

}

const minutes = (60 - timeLeft) / 60;

let wpm = 0;

if(minutes > 0) {
wpm = Math.round((correct / 5) / minutes);
}

let accuracy = 0;

if(input.length > 0) {
accuracy = Math.round((correct / input.length) * 100);
}

document.getElementById("wpm").textContent = wpm;
document.getElementById("accuracy").textContent = accuracy + "%";

}

function finishTest() {

clearInterval(timer);

document.getElementById("typingInput").disabled = true;

const input = document.getElementById("typingInput").value;

let correct = 0;
let wrong = 0;

for(let i = 0; i < input.length; i++) {

if(input[i] === currentSentence[i]) {
correct++;
} else {
wrong++;
}

}

const elapsed = 60 - timeLeft;

let wpm = 0;

if(elapsed > 0) {
wpm = Math.round((correct / 5) / (elapsed / 60));
}

let accuracy = 0;

if(input.length > 0) {
accuracy = Math.round((correct / input.length) * 100);
}

document.getElementById("typingArea").style.display = "none";
document.getElementById("result").style.display = "block";

document.getElementById("finalWpm").textContent = wpm;
document.getElementById("finalAccuracy").textContent = accuracy + "%";
document.getElementById("correctChars").textContent = correct;
document.getElementById("wrongChars").textContent = wrong;

}

function restartTest() {

clearInterval(timer);

document.getElementById("result").style.display = "none";
document.getElementById("typingArea").style.display = "block";

startTest("beginner");

}

function goHome() {

clearInterval(timer);

document.getElementById("result").style.display = "none";
document.getElementById("typingArea").style.display = "none";
document.getElementById("home").style.display = "block";

}

document.addEventListener("keydown", function(event) {

const keyName = event.key.toLowerCase();

let keyId = keyName;

if(event.key === " ") {
keyId = "SPACE";
}

const key = document.getElementById("key-" + keyId);

if(key) {

key.classList.add("pressed");

setTimeout(() => {
key.classList.remove("pressed");
}, 150);

}

});

createKeyboard();

</script>

</body>
  </html>
